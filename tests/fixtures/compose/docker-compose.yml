version: '3.8'

services:
  web:
    image: node:20-alpine
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000

  api:
    image: python:3.11-slim
    command: python -m http.server 5000
    ports:
      - "5000:5000"
    environment:
      - DEBUG=true
      - PORT=5000

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dev

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
